<style>
:root{--bg:#fffff8;--ink:#1c1b19;--ink2:#4b4a45;--ink3:#8a8880;--rule:#d9d7cc;--wash:#efede1;--accent:#b0261c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--ink:#ebe9e1;--ink2:#c4c2b9;--ink3:#8f8d85;--rule:#3d3c38;--wash:#252420;--accent:#f2735f}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;padding:28px 16px 40px;color:var(--ink);background:var(--bg);font:500 15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Segoe UI",Roboto,sans-serif;font-variant-numeric:oldstyle-nums}
main{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 20px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:19px;font-weight:650;line-height:1.35}
nav{font-size:13px;color:var(--ink3);white-space:nowrap}
nav a{color:var(--ink2);text-decoration:none;margin-left:14px}
nav a:hover{color:var(--accent)}
.fig{margin-top:18px;overflow-x:auto}
svg{display:block;width:100%;min-width:680px;height:auto}
svg text{font-family:inherit;font-weight:500;fill:var(--ink);font-size:13.5px}
svg .k{font-size:15px;font-weight:650}
svg .s{font-size:12px;fill:var(--ink3)}
svg .p{font-size:12.5px;font-weight:650;fill:var(--ink3);letter-spacing:.04em}
svg .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;fill:var(--ink2)}
svg .cs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px;fill:var(--ink3)}
svg .a{fill:var(--accent)}
svg .g{fill:var(--ink3)}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.lg{stroke:var(--ink3);stroke-width:1.2;fill:none}
.lr{stroke:var(--rule);stroke-width:1;fill:none}
.la{stroke:var(--accent);stroke-width:1.8;fill:none}
.bar{stroke:var(--ink);stroke-width:7;fill:none}
.barg{stroke:var(--ink3);stroke-width:7;fill:none}
.bara{stroke:var(--accent);stroke-width:7;fill:none}
.dash{stroke-dasharray:5 4}
.dots{stroke-dasharray:1 4;stroke-linecap:round}
.box{fill:none;stroke:var(--ink);stroke-width:1.2}
.boxg{fill:none;stroke:var(--ink3);stroke-width:1}
.boxa{fill:none;stroke:var(--accent);stroke-width:1.6}
.wash{fill:var(--wash);stroke:none}
.fi{fill:var(--ink);stroke:none}
.fg{fill:var(--ink3);stroke:none}
.fa{fill:var(--accent);stroke:none}
.fb{fill:var(--bg);stroke:var(--ink);stroke-width:1.3}
.fbg{fill:var(--bg);stroke:var(--ink3);stroke-width:1.1}
.fba{fill:var(--bg);stroke:var(--accent);stroke-width:1.5}
footer{margin-top:10px;font-size:12px;color:var(--ink3)}
.embed body{padding:6px}
.embed header,.embed footer{display:none}
.embed .fig{margin-top:0}
</style>
</head>
